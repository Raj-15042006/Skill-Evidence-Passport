<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-lg text-on-surface"><main class="min-h-screen flex items-center justify-center p-xl"><div class="flex flex-col w-full h-full items-center justify-center p-xl relative overflow-hidden bg-background">
<!-- Decorative background elements -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<svg class="absolute w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path class="text-outline-variant opacity-50" d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
<div class="absolute top-1/4 left-1/4 w-[40vw] h-[40vw] bg-primary/10 rounded-full blur-[120px] mix-blend-multiply"></div>
<div class="absolute bottom-1/4 right-1/4 w-[30vw] h-[30vw] bg-secondary/10 rounded-full blur-[100px] mix-blend-multiply"></div>
</div>
<!-- Main Card Container -->
<div class="relative w-full max-w-md bg-surface shadow-xl rounded-xl z-10 transition-all duration-300 hover:shadow-2xl flex flex-col p-4xl">
<!-- Header -->
<div class="text-center mb-2xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-lg shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Create Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">Join the verification network.</p>
</div>
<!-- Form -->
<form class="space-y-xl" id="signup-form" onsubmit="event.preventDefault();">
<!-- Role Selection -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block">Select Role</label>
<div class="grid grid-cols-3 gap-sm">
<label class="relative flex flex-col items-center p-md bg-surface-alt rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input checked="" class="peer sr-only" name="role" type="radio" value="student"/>
<span class="material-symbols-outlined mb-xs text-text-muted group-hover:text-primary peer-checked:text-primary transition-colors">school</span>
<span class="font-body-sm text-body-sm text-text-muted group-hover:text-on-surface peer-checked:text-on-surface font-medium transition-colors">Student</span>
<div class="absolute inset-0 rounded-lg border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all pointer-events-none"></div>
</label>
<label class="relative flex flex-col items-center p-md bg-surface-alt rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input class="peer sr-only" name="role" type="radio" value="verifier"/>
<span class="material-symbols-outlined mb-xs text-text-muted group-hover:text-primary peer-checked:text-primary transition-colors">verified_user</span>
<span class="font-body-sm text-body-sm text-text-muted group-hover:text-on-surface peer-checked:text-on-surface font-medium transition-colors">Verifier</span>
<div class="absolute inset-0 rounded-lg border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all pointer-events-none"></div>
</label>
<label class="relative flex flex-col items-center p-md bg-surface-alt rounded-lg cursor-pointer hover:bg-surface-container transition-colors group">
<input class="peer sr-only" name="role" type="radio" value="recruiter"/>
<span class="material-symbols-outlined mb-xs text-text-muted group-hover:text-primary peer-checked:text-primary transition-colors">work</span>
<span class="font-body-sm text-body-sm text-text-muted group-hover:text-on-surface peer-checked:text-on-surface font-medium transition-colors">Recruiter</span>
<div class="absolute inset-0 rounded-lg border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all pointer-events-none"></div>
</label>
</div>
</div>
<!-- Full Name -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block" for="fullname">Full Legal Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-lg">person</span>
</div>
<input class="w-full bg-surface-alt text-on-surface font-body-lg text-body-lg pl-[40px] pr-md py-md rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-text-muted" id="fullname" name="fullname" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block flex justify-between" for="email">
<span>Institutional Email</span>
<span class="text-error font-body-sm text-body-sm lowercase opacity-0 transition-opacity" id="email-error">invalid format</span>
</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-lg">alternate_email</span>
</div>
<input class="w-full bg-surface-alt text-on-surface font-body-lg text-body-lg pl-[40px] pr-md py-md rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-text-muted" id="email" name="email" placeholder="jane.doe@university.edu" required="" type="email"/>
<div class="absolute inset-y-0 right-0 pr-md flex items-center pointer-events-none opacity-0 transition-opacity" id="email-check">
<span class="material-symbols-outlined text-success-text" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Password -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-lg">lock</span>
</div>
<input class="w-full bg-surface-alt text-on-surface font-body-lg text-body-lg pl-[40px] pr-[40px] py-md rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-text-muted" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-text-muted hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" id="password-visibility-icon">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="w-full mt-xs">
<div class="flex gap-xs h-1 rounded-full overflow-hidden bg-surface-alt">
<div class="flex-1 bg-surface-variant transition-colors duration-300" id="str-1"></div>
<div class="flex-1 bg-surface-variant transition-colors duration-300" id="str-2"></div>
<div class="flex-1 bg-surface-variant transition-colors duration-300" id="str-3"></div>
<div class="flex-1 bg-surface-variant transition-colors duration-300" id="str-4"></div>
</div>
<p class="font-body-sm text-body-sm text-text-muted mt-xs h-5 text-right" id="password-feedback"></p>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-md pt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-alt border-outline rounded focus:ring-primary focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface cursor-pointer" id="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                    I agree to the <a class="text-primary hover:text-primary-hover hover:underline transition-colors" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-hover hover:underline transition-colors" href="#">Privacy Policy</a>.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full h-10 bg-primary hover:bg-primary-hover text-on-primary font-headline-xs text-headline-xs rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-px active:translate-y-0 flex justify-center items-center gap-sm" type="submit">
                Create Account
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<div class="text-center font-body-sm text-body-sm text-on-surface-variant pt-md">
                Already have an account? <a class="text-primary hover:text-primary-hover hover:underline font-medium transition-colors" href="#">Log in</a>
</div>
</form>
</div>
<!-- Right Side Decorative Panel (Desktop Only) -->
<div class="hidden lg:block absolute right-0 top-0 bottom-0 w-1/3 bg-surface-alt z-0 overflow-hidden" style="clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);">
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent mix-blend-multiply"></div>
<div class="absolute w-[200%] h-[200%] top-[-50%] left-[-50%] animate-[spin_60s_linear_infinite] opacity-30">
<svg class="w-full h-full text-primary-fixed-dim fill-current" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<polygon points="50,10 90,90 10,90"></polygon>
</svg>
</div>
<div class="absolute bottom-4xl right-4xl p-2xl bg-surface/80 backdrop-blur-md rounded-xl shadow-lg border border-outline/10 max-w-xs transform rotate-2">
<div class="flex items-center gap-md mb-md">
<span class="material-symbols-outlined text-success-text" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Trusted Network</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join thousands of verified institutions and professionals maintaining the integrity of academic and professional credentials.</p>
</div>
</div>
</div>
<script>
    // Password Visibility Toggle
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('password-visibility-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    // Email Validation (Simple inline regex check)
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('email-error');
    const emailCheck = document.getElementById('email-check');

    emailInput.addEventListener('input', function() {
        const email = this.value;
        // Basic pattern matching for institution-like emails (e.g. requires .edu or similar, this is just a mockup regex)
        const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; 
        
        if (email.length === 0) {
            emailError.classList.remove('opacity-100');
            emailError.classList.add('opacity-0');
            emailCheck.classList.remove('opacity-100');
            emailCheck.classList.add('opacity-0');
            this.classList.remove('ring-error', 'ring-2');
        } else if (pattern.test(email)) {
            emailError.classList.remove('opacity-100');
            emailError.classList.add('opacity-0');
            emailCheck.classList.remove('opacity-0');
            emailCheck.classList.add('opacity-100');
            this.classList.remove('ring-error', 'ring-2');
            this.classList.add('ring-success-text'); // Optional positive feedback ring
        } else {
            emailError.classList.remove('opacity-0');
            emailError.classList.add('opacity-100');
            emailCheck.classList.remove('opacity-100');
            emailCheck.classList.add('opacity-0');
            this.classList.add('ring-error', 'ring-2');
            this.classList.remove('ring-success-text');
        }
    });

    // Password Strength Meter
    const passwordInput = document.getElementById('password');
    const strBars = [
        document.getElementById('str-1'),
        document.getElementById('str-2'),
        document.getElementById('str-3'),
        document.getElementById('str-4')
    ];
    const feedback = document.getElementById('password-feedback');

    passwordInput.addEventListener('input', function() {
        const val = this.value;
        let score = 0;
        
        if (val.length > 5) score += 1;
        if (val.length > 8) score += 1;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 1;
        if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score += 1;

        // Reset colors
        strBars.forEach(bar => {
            bar.className = 'flex-1 bg-surface-variant transition-colors duration-300';
        });

        if (val.length === 0) {
            feedback.textContent = '';
            return;
        }

        switch(score) {
            case 1:
                strBars[0].classList.add('bg-error');
                feedback.textContent = 'Weak';
                feedback.className = 'font-body-sm text-body-sm text-error mt-xs h-5 text-right';
                break;
            case 2:
                strBars[0].classList.add('bg-warning-text');
                strBars[1].classList.add('bg-warning-text');
                feedback.textContent = 'Fair';
                feedback.className = 'font-body-sm text-body-sm text-warning-text mt-xs h-5 text-right';
                break;
            case 3:
                strBars[0].classList.add('bg-secondary');
                strBars[1].classList.add('bg-secondary');
                strBars[2].classList.add('bg-secondary');
                feedback.textContent = 'Good';
                feedback.className = 'font-body-sm text-body-sm text-secondary mt-xs h-5 text-right';
                break;
            case 4:
                strBars[0].classList.add('bg-success-text');
                strBars[1].classList.add('bg-success-text');
                strBars[2].classList.add('bg-success-text');
                strBars[3].classList.add('bg-success-text');
                feedback.textContent = 'Strong';
                feedback.className = 'font-body-sm text-body-sm text-success-text mt-xs h-5 text-right';
                break;
            default:
                strBars[0].classList.add('bg-error');
                feedback.textContent = 'Very Weak';
                feedback.className = 'font-body-sm text-body-sm text-error mt-xs h-5 text-right';
        }
    });
</script></main></body></html>
