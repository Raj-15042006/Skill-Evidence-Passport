<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-lg text-on-surface"><main class="min-h-screen flex items-center justify-center p-xl"><div class="flex flex-col w-full max-w-md mx-auto my-32">
<div class="bg-surface-container-lowest rounded-xl shadow-lg p-xl relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute -top-16 -right-16 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
<div class="absolute -bottom-16 -left-16 w-32 h-32 bg-secondary/5 rounded-full blur-2xl"></div>
<div class="relative z-10">
<div class="mb-4xl text-center">
<span class="material-symbols-outlined text-primary text-4xl mb-md" style="font-variation-settings: 'FILL' 1;">
          lock_reset
        </span>
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Recover Access</h1>
<p class="font-body-sm text-body-sm text-text-secondary">
          Enter your registered institutional email to receive a secure reset link.
        </p>
</div>
<form class="space-y-gutter flex flex-col" id="resetForm">
<div class="flex flex-col space-y-base">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="email">
            Institutional Email
          </label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-text-muted">
              mail
            </span>
<input class="w-full bg-surface-alt font-body-lg text-body-lg text-on-surface rounded-lg py-md pl-3xl pr-md focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" id="email" name="email" placeholder="user@university.edu" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline-xs text-headline-xs py-md rounded-lg hover:bg-primary-hover active:scale-[0.98] transition-all flex items-center justify-center space-x-sm shadow-md hover:shadow-lg" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<div class="hidden mt-4xl flex-col items-center text-center" id="successState">
<div class="w-16 h-16 bg-success-fill rounded-full flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-success-text text-2xl" style="font-variation-settings: 'FILL' 1;">
            mark_email_read
          </span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Reset link sent</h2>
<p class="font-body-sm text-body-sm text-text-secondary">
          Please check your institutional email for instructions to reset your password.
        </p>
</div>
</div>
</div>
<div class="mt-lg text-center">
<a class="inline-flex items-center space-x-xs font-body-sm text-body-sm text-primary hover:text-primary-hover transition-colors" href="/login">
<span class="material-symbols-outlined text-sm">arrow_back</span>
<span>Return to Login</span>
</a>
</div>
</div>
<script>
  document.getElementById('resetForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = this.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    
    // Loading state
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Sending...</span>';
    btn.disabled = true;
    btn.classList.add('opacity-75');

    // Simulate API call
    setTimeout(() => {
      this.classList.add('hidden');
      const successState = document.getElementById('successState');
      successState.classList.remove('hidden');
      successState.classList.add('flex', 'animate-[fadeIn_0.5s_ease-out]');
    }, 1200);
  });
</script>
<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style></main></body></html>
